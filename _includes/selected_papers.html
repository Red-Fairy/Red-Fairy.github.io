<div class="publications-section">
  <div class="view-buttons" role="group" aria-label="Publications view" hidden>
    <button type="button" aria-pressed="true" data-view="by-date">By date</button>
    <button type="button" aria-pressed="false" data-view="selected">Selected</button>
  </div>
  <p class="contributions"><sup>*</sup> Equal contribution <span aria-hidden="true">·</span> <sup>†</sup> Equal advising</p>
  <div class="publications">
    {% bibliography -f papers %}
  </div>
</div>

<script>
  const views = document.querySelector('.view-buttons');
  views.hidden = false;
  for (const button of views.querySelectorAll('button')) {
    button.addEventListener('click', () => {
      for (const choice of views.querySelectorAll('button')) {
        choice.setAttribute('aria-pressed', String(choice === button));
      }
      for (const list of document.querySelectorAll('.publications-section ol.bibliography')) {
        for (const paper of list.children) {
          paper.hidden = button.dataset.view === 'selected' && !paper.querySelector('[data-selected]');
        }
        list.hidden = !list.querySelector('li:not([hidden])');
        list.previousElementSibling.hidden = list.hidden;
      }
    });
  }
</script>
